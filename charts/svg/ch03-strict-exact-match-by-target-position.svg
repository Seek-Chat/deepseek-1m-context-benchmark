<text x="322" y="833" font-family="Arial, sans-serif" font-size="19" fill="#334155">V4 PRO</text>
<text x="1510" y="833" text-anchor="end" font-family="Arial, sans-serif" font-size="17" fill="#64748b">PRIMARY N=288</text>
